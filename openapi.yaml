openapi: 3.0.3
info:
  title: Ocean Ledger API
  version: 1.0.0
  description: |
    Demo API used to showcase developer documentation on GitHub Pages.
    The API is fictional and all data is sample data.

    Collections support OData-style query options (`$filter`, `$select`, `$orderby`, `$top`, `$skiptoken`).
    Limits are 60 requests per minute and 5,000 per day, per app and division.
servers:
  - url: https://api.oceanledger.example/v1
    description: Demo server (not a real endpoint)
security:
  - oauth2: []
tags:
  - name: Accounts
  - name: Items
  - name: Invoices

paths:
  /{division}/accounts:
    parameters:
      - $ref: "#/components/parameters/Division"
    get:
      tags: [Accounts]
      summary: List accounts
      operationId: listAccounts
      security:
        - oauth2: [accounts.read]
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Select"
        - $ref: "#/components/parameters/OrderBy"
        - $ref: "#/components/parameters/Top"
        - $ref: "#/components/parameters/SkipToken"
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
                  next:
                    type: string
                    format: uri
                    description: URL of the next page. Absent on the last page.
              example:
                data:
                  - id: c3f2a8d1-6e0b-4a57-8d34-0b9c1a7e52f4
                    code: "10042"
                    name: Northwind Traders
                    type: customer
                    currency: EUR
                next: https://api.oceanledger.example/v1/1001/accounts?$skiptoken=eyJwIjoyfQ
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Accounts]
      summary: Create an account
      operationId: createAccount
      security:
        - oauth2: [accounts.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
            example:
              name: Fabrikam Studio
              type: customer
              currency: EUR
      responses:
        "201":
          description: The created account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Account"
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /{division}/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/Division"
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Accounts]
      summary: Get an account
      operationId: getAccount
      security:
        - oauth2: [accounts.read]
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Account"
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Accounts]
      summary: Update an account
      description: Only the fields you send are changed.
      operationId: updateAccount
      security:
        - oauth2: [accounts.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Account"
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Accounts]
      summary: Delete an account
      description: An account that has invoices cannot be deleted.
      operationId: deleteAccount
      security:
        - oauth2: [accounts.write]
      responses:
        "204":
          description: Deleted.
        "409": { $ref: "#/components/responses/Error" }

  /{division}/items:
    parameters:
      - $ref: "#/components/parameters/Division"
    get:
      tags: [Items]
      summary: List items
      operationId: listItems
      security:
        - oauth2: [items.read]
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Select"
        - $ref: "#/components/parameters/OrderBy"
        - $ref: "#/components/parameters/Top"
        - $ref: "#/components/parameters/SkipToken"
      responses:
        "200":
          description: A page of items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Item"
                  next:
                    type: string
                    format: uri
    post:
      tags: [Items]
      summary: Create an item
      operationId: createItem
      security:
        - oauth2: [items.write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
            example:
              code: WIDGET-S
              description: Widget, small
              unit: pcs
              sales_price: 19.95
              currency: EUR
              vat_rate: 21.0
      responses:
        "201":
          description: The created item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Item"
        "409": { $ref: "#/components/responses/Error" }

  /{division}/items/{id}:
    parameters:
      - $ref: "#/components/parameters/Division"
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Items]
      summary: Get an item
      operationId: getItem
      security:
        - oauth2: [items.read]
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Item"
        "404": { $ref: "#/components/responses/Error" }

  /{division}/invoices:
    parameters:
      - $ref: "#/components/parameters/Division"
    get:
      tags: [Invoices]
      summary: List invoices
      operationId: listInvoices
      security:
        - oauth2: [invoices.read]
      parameters:
        - $ref: "#/components/parameters/Filter"
        - $ref: "#/components/parameters/Select"
        - $ref: "#/components/parameters/OrderBy"
        - $ref: "#/components/parameters/Top"
        - $ref: "#/components/parameters/SkipToken"
      responses:
        "200":
          description: A page of invoices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invoice"
                  next:
                    type: string
                    format: uri
    post:
      tags: [Invoices]
      summary: Create an invoice
      operationId: createInvoice
      security:
        - oauth2: [invoices.write]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Makes retries safe. Repeating a request with the same key within 24 hours returns the original response.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
            example:
              account_id: c3f2a8d1-6e0b-4a57-8d34-0b9c1a7e52f4
              invoice_date: "2026-10-08"
              currency: EUR
              lines:
                - item_id: 5d9b7c10-1a2e-4f60-b3c8-7e41d0a96f12
                  quantity: 3
      responses:
        "201":
          description: The created invoice.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Invoice"
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /{division}/invoices/{id}:
    parameters:
      - $ref: "#/components/parameters/Division"
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Invoices]
      summary: Get an invoice
      operationId: getInvoice
      security:
        - oauth2: [invoices.read]
      responses:
        "200":
          description: The invoice including its lines.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Invoice"
        "404": { $ref: "#/components/responses/Error" }
    delete:
      tags: [Invoices]
      summary: Cancel an invoice
      description: Draft invoices are deleted. Open invoices are set to `cancelled`. Paid invoices cannot be cancelled.
      operationId: cancelInvoice
      security:
        - oauth2: [invoices.write]
      responses:
        "204":
          description: Cancelled.
        "409": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 authorization code flow.
      flows:
        authorizationCode:
          authorizationUrl: https://auth.oceanledger.example/oauth2/authorize
          tokenUrl: https://auth.oceanledger.example/oauth2/token
          scopes:
            accounts.read: Read accounts
            accounts.write: Create and update accounts
            items.read: Read items
            items.write: Create and update items
            invoices.read: Read invoices
            invoices.write: Create and update invoices

  parameters:
    Division:
      name: division
      in: path
      required: true
      description: The division (company administration) code.
      schema:
        type: integer
      example: 1001
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Filter:
      name: $filter
      in: query
      description: "Return only matching records, for example `status eq 'open' and total gt 1000`."
      schema:
        type: string
    Select:
      name: $select
      in: query
      description: Comma-separated list of fields to return.
      schema:
        type: string
    OrderBy:
      name: $orderby
      in: query
      description: "Sort order, for example `invoice_date desc`."
      schema:
        type: string
    Top:
      name: $top
      in: query
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 60
        default: 60
    SkipToken:
      name: $skiptoken
      in: query
      description: Continuation token taken from the `next` link.
      schema:
        type: string

  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: validation_failed
            message:
              type: string
              example: One or more fields are invalid.
            request_id:
              type: string
              example: req_8d2f4a1b9c
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: lines[0].quantity
                  message:
                    type: string
                    example: Must be greater than 0.

    Account:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string, maxLength: 18, example: "10042" }
        name: { type: string, example: Northwind Traders }
        type: { type: string, enum: [customer, supplier] }
        email: { type: string, format: email, example: accounts@northwind.example }
        vat_number: { type: string, example: NL123456789B01 }
        currency: { type: string, example: EUR }
        outstanding_amount: { type: number, readOnly: true, example: 1250.0 }
        created: { type: string, format: date-time, readOnly: true }
        modified: { type: string, format: date-time, readOnly: true }
    AccountInput:
      type: object
      required: [name, type]
      properties:
        code: { type: string, maxLength: 18 }
        name: { type: string }
        type: { type: string, enum: [customer, supplier] }
        email: { type: string, format: email }
        vat_number: { type: string }
        currency: { type: string }

    Item:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        code: { type: string, example: WIDGET-L }
        description: { type: string, example: "Widget, large" }
        unit: { type: string, example: pcs }
        sales_price: { type: number, example: 49.5 }
        currency: { type: string, example: EUR }
        vat_rate: { type: number, example: 21.0 }
        is_active: { type: boolean }
        modified: { type: string, format: date-time, readOnly: true }
    ItemInput:
      type: object
      required: [code, description]
      properties:
        code: { type: string }
        description: { type: string }
        unit: { type: string }
        sales_price: { type: number }
        currency: { type: string }
        vat_rate: { type: number }
        is_active: { type: boolean }

    InvoiceLine:
      type: object
      required: [item_id, quantity]
      properties:
        item_id: { type: string, format: uuid }
        description: { type: string }
        quantity: { type: number, exclusiveMinimum: true, minimum: 0 }
        unit_price: { type: number }
        vat_rate: { type: number }
    Invoice:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true }
        number: { type: integer, readOnly: true, example: 2026001 }
        account_id: { type: string, format: uuid }
        invoice_date: { type: string, format: date }
        due_date: { type: string, format: date }
        currency: { type: string, example: EUR }
        status: { type: string, enum: [draft, open, paid, cancelled] }
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLine"
        subtotal: { type: number, readOnly: true, example: 148.5 }
        vat_total: { type: number, readOnly: true, example: 31.19 }
        total: { type: number, readOnly: true, example: 179.69 }
        modified: { type: string, format: date-time, readOnly: true }
    InvoiceInput:
      type: object
      required: [account_id, invoice_date, currency, lines]
      properties:
        account_id: { type: string, format: uuid }
        invoice_date: { type: string, format: date }
        due_date: { type: string, format: date }
        currency: { type: string }
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/InvoiceLine"
